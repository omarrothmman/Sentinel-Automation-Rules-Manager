[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-automation-rules"
version = "1.5.0"
description = "Safe content-as-code management for Microsoft Sentinel automation rules across Azure Lighthouse workspaces"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["azure", "microsoft-sentinel", "automation-rules", "azure-lighthouse"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "azure-identity>=1.19,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "ruff>=0.12,<1",
    "setuptools>=77",
    "wheel",
]

[project.urls]
Homepage = "https://github.com/omarrothmman/Sentinel-Automation-Rules-Manager"
Documentation = "https://github.com/omarrothmman/Sentinel-Automation-Rules-Manager#readme"
Issues = "https://github.com/omarrothmman/Sentinel-Automation-Rules-Manager/issues"

[project.scripts]
sentinel-auto = "sentinel_automation.cli:main"
sentinel-auto-gui = "sentinel_automation.gui:main"

[tool.setuptools.package-data]
sentinel_automation = ["web/*.html", "web/*.css", "web/*.js"]

[tool.setuptools.packages.find]
include = ["sentinel_automation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "BLE001", # Per-target failures must be captured so remaining workspaces continue.
    "N999",   # The checked-out repository directory contains hyphens; package names do not.
]
